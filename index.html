<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Synapse Media</title>
    <style>
        :root {
            --bg-main: #080A0F;
            --bg-card: #121620;
            --bg-card-hover: #1A202C;
            --surface: #0F131A;
            --border: #1F2937;
            --accent: #4FD1C5;
            --accent-dim: #0F4C48;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --focus: #4FD1C5;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        :focus { outline: none; }
        .focusable:focus, button:focus, a:focus, input:focus, select:focus, .card:focus {
            outline: 3px solid var(--focus) !important;
            outline-offset: 4px;
            box-shadow: 0 0 15px rgba(79, 209, 197, 0.3);
            border-radius: var(--radius);
        }
        .card:focus { transform: scale(1.05); z-index: 10; }

        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
        }

        .logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 1.4rem; color: white; text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span {
            width: 32px; height: 32px; background: var(--accent-dim);
            color: var(--accent);
            border-radius: 8px; display: grid; place-items: center;
            font-size: 18px; font-weight: 900;
        }

        .nav-tabs { display: flex; gap: 10px; margin-right: 20px; }
        .nav-tab {
            padding: 8px 16px; border-radius: 8px; border: none; background: transparent;
            color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .nav-tab:hover { color: var(--text-main); background: var(--surface); }
        .nav-tab.active { color: var(--accent); background: var(--accent-dim); }

        .search-wrap { flex: 1; min-width: 250px; max-width: 500px; position: relative; }
        .search-wrap input {
            width: 100%; padding: 12px 48px 12px 16px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text-main);
            font-size: 15px; transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap button {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: var(--accent-dim); color: var(--accent); border: none;
            width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 16px;
            display: grid; place-items: center; transition: all 0.2s;
        }
        .search-wrap button:hover { background: var(--accent); color: var(--bg-main); }

        main { max-width: 1440px; margin: 0 auto; padding: 32px; }
        .section-header { margin-bottom: 24px; display: flex; align-items: baseline; gap: 16px; }
        .section-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }

        .card {
            background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }
        .card:hover { transform: translateY(-8px); background: var(--bg-card-hover); border-color: #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-poster { aspect-ratio: 2/3; background: var(--surface); position: relative; }
        .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-poster .placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: var(--text-muted); font-size: 32px; }
        .card-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(15, 19, 26, 0.9); backdrop-filter: blur(4px);
            color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
        }
        .card-body { padding: 14px; }
        .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .channel-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .channel-card:hover { background: var(--bg-card-hover); border-color: var(--accent); transform: translateX(4px); }
        .channel-icon { color: var(--accent); font-size: 20px; }

        .status { text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        
        .modal {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; width: min(1000px, 95vw); max-height: 95vh; overflow-y: auto;
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        }
        
        .modal-close {
            position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
            border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: white;
            font-size: 24px; cursor: pointer; z-index: 50; display: grid; place-items: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: #ef4444; }

        .player-wrap {
            width: 100%; background: #000; aspect-ratio: 16/9; position: relative;
            border-radius: 16px 16px 0 0; overflow: hidden;
        }
        .player-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
        
        .player-placeholder {
            position: absolute; inset: 0; display: grid; place-items: center;
            color: var(--text-muted); font-size: 15px; background: #000;
        }

        .player-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; justify-content: flex-end; gap: 10px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .player-controls.visible { opacity: 1; pointer-events: auto; }
        .ctrl-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.2); }

        #fullscreenOverlay {
            position: fixed; inset: 0; background: #000; z-index: 9999; display: none;
            align-items: center; justify-content: center;
        }
        #fullscreenOverlay.active { display: flex; }
        #fullscreenOverlay iframe { width: 100%; height: 100%; border: 0; }

        .modal-body { padding: 24px 32px 32px; }
        .modal-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .modal-meta { color: var(--accent); font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; gap: 12px; }
        .modal-desc { font-size: 15px; color: #CBD5E1; margin-bottom: 24px; line-height: 1.6; }

        .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 12px; }
        .server-row, .ep-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
        .server-btn, .ep-btn {
            padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-main); font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .server-btn:hover, .ep-btn:hover { background: var(--border); }
        .server-btn.active, .ep-btn.active { background: var(--accent); color: var(--bg-main); border-color: var(--accent); box-shadow: 0 0 15px rgba(79, 209, 197, 0.3); }

        select.btn { appearance: none; padding-right: 32px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394A3B8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 12px auto; }
        select.btn option { background: var(--surface); color: var(--text-main); }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo focusable" id="logoBtn" tabindex="0">
            <span>S</span> SYNAPSE
        </a>
        <div class="nav-tabs">
            <button class="nav-tab focusable active" id="tabMovies" tabindex="0">Movies & TV</button>
            <button class="nav-tab focusable" id="tabLive" tabindex="0">Live TV</button>
            <button class="nav-tab focusable" id="tabSports" tabindex="0">Sports (F1)</button>
        </div>
        <div class="search-wrap">
            <input id="searchInput" class="focusable" type="search" placeholder="Search movies, TV shows..." autocomplete="off" tabindex="0" />
            <button id="searchBtn" class="focusable" title="Search" tabindex="0">🔍</button>
        </div>
    </header>

    <main id="mainContent">
        <div class="section-header">
            <h1 class="section-title" id="sectionLabel">Trending</h1>
            <span class="count" id="resultCount"></span>
        </div>
        <div id="content">
            <div class="status"><div class="spinner"></div>Loading...</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="modal-close focusable" id="modalClose" tabindex="0">×</button>
            
            <div class="player-wrap" id="playerWrapper">
                <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
                <div class="player-placeholder" id="playerPlaceholder">Select a stream to play</div>
                
                <div class="player-controls" id="playerControls">
                    <button class="ctrl-btn" id="btnFullscreen" tabindex="0">⛶ Fullscreen</button>
                </div>
            </div>

            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle">—</h2>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-desc" id="modalDesc"></div>

                <div id="episodeSection" style="display:none">
                    <div class="label">Season / Episode</div>
                    <div style="margin-bottom:12px">
                        <select id="seasonSelect" class="btn focusable" tabindex="0"></select>
                    </div>
                    <div class="ep-row" id="epList"></div>
                </div>

                <div class="label">Select Server</div>
                <div class="server-row" id="serverList"></div>
            </div>
        </div>
    </div>

    <div id="fullscreenOverlay">
        <iframe id="fsFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
        <div class="player-controls" id="fsControls" style="position:absolute; bottom:0; width:100%;">
            <button class="ctrl-btn" id="btnExitFullscreen" tabindex="0">✕ Exit Fullscreen</button>
        </div>
    </div>

    <script>
        const HARDCODED_API_KEY = "f39bddc7bc5efa5f39a3dd0be729df5e";
        const TMDB = "https://api.themoviedb.org/3";
        const IMG = "https://image.tmdb.org/t/p/w500";
        // Swapped to a more reliable proxy
        const PROXY_URL = 'https://corsproxy.io/?';
        const IPTV_URL = encodeURIComponent('https://iptv-org.github.io/iptv/index.m3u');

        const SERVERS = [
            { name: "VidSrc.me", movie: (id) => `https://vidsrc.me/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.me/embed/tv/${id}/${s}/${e}` },
            { name: "VidSrc.to", movie: (id) => `https://vidsrc.to/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}` },
            { name: "VidSrc.xyz", movie: (id) => `https://vidsrc.xyz/embed/movie/${id}`, tv: (id, s, e) => `https://vidsrc.xyz/embed/tv/${id}/${s}/${e}` },
            { name: "MultiEmbed", movie: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`, tv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}` }
        ];

        let apiKey = HARDCODED_API_KEY;
        let currentItems = [];
        let currentItem = null;
        let currentSe = 1, currentEp = 1;
        let currentMode = "movies"; 
        let controlTimeout = null;

        function $(id) { return document.getElementById(id); }
        function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

        $("tabMovies").addEventListener("click", () => switchTab("movies"));
        $("tabLive").addEventListener("click", () => switchTab("live"));
        $("tabSports").addEventListener("click", () => switchTab("sports"));

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
            
            if (mode === "movies") {
                $("tabMovies").classList.add("active");
                $("searchInput").style.display = "block";
                loadTrending();
            } else if (mode === "live") {
                $("tabLive").classList.add("active");
                $("searchInput").style.display = "none";
                loadLiveTV();
            } else if (mode === "sports") {
                $("tabSports").classList.add("active");
                $("searchInput").style.display = "none";
                loadSports();
            }
        }

        // --- Movie Logic ---
        async function tmdb(path, params = {}) {
            const q = new URLSearchParams({ api_key: apiKey, language: "en-US", ...params });
            const res = await fetch(`${TMDB}${path}?${q}`);
            if (!res.ok) throw new Error("TMDB HTTP " + res.status);
            return res.json();
        }

        function showStatus(html, isError) {
            $("content").innerHTML = `<div class="status ${isError ? "error" : ""}">${html}</div>`;
            $("resultCount").textContent = "";
        }

        function posterOf(item) { return item.poster_path ? IMG + item.poster_path : null; }
        function titleOf(item) { return item.title || item.name || "Untitled"; }
        function yearOf(item) { const d = item.release_date || item.first_air_date || ""; return d ? d.slice(0, 4) : ""; }
        function mediaType(item) {
            if (item.media_type === "tv" || item.first_air_date) return "tv";
            if (item.media_type === "movie" || item.release_date) return "movie";
            return item.title ? "movie" : "tv";
        }

        async function loadTrending() {
            $("sectionLabel").textContent = "Trending This Week";
            $("resultCount").textContent = "";
            $("searchInput").value = "";
            showStatus(`<div class="spinner"></div>Fetching...`);
            try {
                const data = await tmdb("/trending/all/week");
                const items = (data.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
                currentItems = items;
                renderGrid(items);
                $("resultCount").textContent = items.length + " titles";
                focusFirstCard();
            } catch (e) { showStatus(`<p><strong>Error: ${escapeHtml(e.message)}</strong></p>`, true); }
        }

        async function search(q) {
            q = (q || $("searchInput").value || "").trim();
            if (!q) return loadTrending();
            $("searchInput").value = q;
            $("sectionLabel").textContent = `Search: "${q}"`;
            showStatus(`<div class="spinner"></div>Searching...`);
            try {
                const data = await tmdb("/search/multi", { query: q, include_adult: "false" });
                const items = (data.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
                currentItems = items;
                renderGrid(items);
                $("resultCount").textContent = items.length + " results";
                focusFirstCard();
            } catch (e) { showStatus(`<p><strong>Error: ${escapeHtml(e.message)}</strong></p>`, true); }
        }

        function renderGrid(items) {
            if (!items.length) return showStatus("No results found.");
            $("content").innerHTML = `<div class="grid" id="cardGrid">${items.map((item, idx) => {
                const poster = posterOf(item);
                const title = titleOf(item);
                const year = yearOf(item);
                const type = mediaType(item) === "tv" ? "TV" : "Movie";
                const score = item.vote_average ? item.vote_average.toFixed(1) : "";
                return `
                <div class="card focusable" tabindex="0" data-idx="${idx}" role="button" aria-label="${escapeHtml(title)}">
                    <div class="card-poster">
                        ${poster ? `<img src="${poster}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎬</div>'"/>` : `<div class="placeholder">🎬</div>`}
                        <span class="card-badge">${type}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${escapeHtml(title)}</div>
                        <div class="card-meta">${year ? year + " · " : ""}${score ? "★ " + score : ""}</div>
                    </div>
                </div>`;
            }).join("")}</div>`;

            document.querySelectorAll(".card").forEach(card => {
                card.addEventListener("click", () => openDetail(parseInt(card.dataset.idx, 10)));
                card.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " " || e.key === "OK") { e.preventDefault(); openDetail(parseInt(card.dataset.idx, 10)); }
                });
            });
        }

        function focusFirstCard() { const c = document.querySelector(".card"); if (c) setTimeout(() => c.focus(), 40); }

        async function openDetail(idx) {
            const item = currentItems[idx];
            if (!item) return;
            currentItem = item; currentSe = 1; currentEp = 1;

            const type = mediaType(item);
            $("modalTitle").textContent = titleOf(item);
            $("modalMeta").textContent = [ type === "tv" ? "TV Series" : "Movie", yearOf(item), item.vote_average ? "★ " + item.vote_average.toFixed(1) : "" ].filter(Boolean).join("  ·  ");
            $("modalDesc").textContent = item.overview || "No description available.";
            $("playerFrame").src = "about:blank";
            $("playerPlaceholder").style.display = "grid";

            $("serverList").innerHTML = SERVERS.map((s, i) =>
                `<button class="server-btn focusable ${i === 0 ? "active" : ""}" data-i="${i}" tabindex="0">${s.name}</button>`
            ).join("");

            document.querySelectorAll(".server-btn").forEach(btn => {
                btn.addEventListener("click", () => selectServer(btn.dataset.i));
                btn.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectServer(btn.dataset.i); }
                });
            });

            if (type === "tv") {
                $("episodeSection").style.display = "block";
                try {
                    const detail = await tmdb(`/tv/${item.id}`);
                    const seasons = (detail.seasons || []).filter(s => s.season_number > 0);
                    $("seasonSelect").innerHTML = seasons.map(s =>
                        `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count || "?"} eps)</option>`
                    ).join("") || `<option value="1">Season 1</option>`;
                    await loadEpisodeButtons(1);
                } catch { $("seasonSelect").innerHTML = `<option value="1">Season 1</option>`; buildSimpleEpisodes(12); }
            } else { $("episodeSection").style.display = "none"; }

            $("modal").classList.add("open");
            selectServer(0);
            setTimeout(() => { const s = document.querySelector(".server-btn"); if (s) s.focus(); }, 80);
        }

        async function onSeasonChange() {
            const se = parseInt($("seasonSelect").value, 10) || 1;
            currentSe = se; currentEp = 1;
            await loadEpisodeButtons(se);
            selectServer(document.querySelector(".server-btn.active")?.dataset.i || 0);
        }

        async function loadEpisodeButtons(se) {
            try {
                const data = await tmdb(`/tv/${currentItem.id}/season/${se}`);
                const eps = data.episodes || [];
                if (!eps.length) return buildSimpleEpisodes(12);
                $("epList").innerHTML = eps.map(ep =>
                    `<button class="ep-btn focusable ${ep.episode_number === currentEp ? "active" : ""}" tabindex="0" data-ep="${ep.episode_number}">E${ep.episode_number}</button>`
                ).join("");
                wireEpButtons();
            } catch { buildSimpleEpisodes(12); }
        }

        function buildSimpleEpisodes(n) {
            $("epList").innerHTML = Array.from({ length: n }, (_, i) => i + 1).map(n =>
                `<button class="ep-btn focusable ${n === currentEp ? "active" : ""}" tabindex="0" data-ep="${n}">E${n}</button>`
            ).join("");
            wireEpButtons();
        }

        function wireEpButtons() {
            document.querySelectorAll(".ep-btn").forEach(btn => {
                btn.addEventListener("click", () => selectEpisode(parseInt(btn.dataset.ep, 10)));
                btn.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectEpisode(parseInt(btn.dataset.ep, 10)); }
                });
            });
        }

        function selectEpisode(ep) {
            currentEp = ep;
            document.querySelectorAll(".ep-btn").forEach(b => b.classList.toggle("active", parseInt(b.dataset.ep, 10) === ep));
            const active = document.querySelector(".server-btn.active");
            selectServer(active ? active.dataset.i : 0);
        }

        function selectServer(i) {
            i = parseInt(i, 10) || 0;
            document.querySelectorAll(".server-btn").forEach(b => b.classList.toggle("active", parseInt(b.dataset.i, 10) === i));
            const server = SERVERS[i] || SERVERS[0];
            const item = currentItem;
            if (!item) return;
            const type = mediaType(item);
            const url = type === "tv" ? server.tv(item.id, currentSe, currentEp) : server.movie(item.id);
            
            $("playerPlaceholder").style.display = "none";
            $("playerFrame").src = url;
            $("fsFrame").src = url;
            showControls();
        }

        // --- Live TV Logic ---
        async function loadLiveTV() {
            $("sectionLabel").textContent = "Live TV Channels";
            $("resultCount").textContent = "";
            showStatus(`<div class="spinner"></div>Loading channels from GitHub...`);
            
            try {
                const response = await fetch(PROXY_URL + IPTV_URL);
                const text = await response.text();
                const channels = parseM3U(text);
                
                if (channels.length === 0) return showStatus("No channels found.");
                
                $("resultCount").textContent = channels.length + " channels";
                $("content").innerHTML = `<div class="channel-grid">${channels.map((ch, idx) => `
                    <div class="channel-card focusable" tabindex="0" data-url="${escapeHtml(ch.url)}" data-title="${escapeHtml(ch.title)}">
                        <span class="channel-icon">📺</span>
                        <span>${escapeHtml(ch.title)}</span>
                    </div>
                `).join("")}</div>`;

                document.querySelectorAll(".channel-card").forEach(card => {
                    card.addEventListener("click", () => playLiveStream(card.dataset.url, card.dataset.title));
                    card.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " " || e.key === "OK") { e.preventDefault(); playLiveStream(card.dataset.url, card.dataset.title); }
                    });
                });

            } catch (err) {
                showStatus(`<p><strong>Error loading playlist: ${escapeHtml(err.message)}</strong></p>`, true);
            }
        }

        // --- Sports Logic ---
        function loadSports() {
            $("sectionLabel").textContent = "Live Sports (FanCode)";
            $("resultCount").textContent = "External Embed";
            $("content").innerHTML = `
                <div class="channel-grid">
                    <div class="channel-card focusable" tabindex="0" id="loadF1Btn">
                        <span class="channel-icon">🏎️</span>
                        <span>Load FanCode Racing Streams</span>
                    </div>
                </div>
            `;
            
            $("loadF1Btn").addEventListener("click", () => {
                // Open the external site in the player
                $("modalTitle").textContent = "FanCode Racing";
                $("modalMeta").textContent = "LIVE SPORTS";
                $("modalDesc").textContent = "If the stream doesn't load, click the 'Watch Live' button inside the player.";
                $("episodeSection").style.display = "none";
                $("serverList").style.display = "none";
                
                $("playerPlaceholder").style.display = "none";
                $("playerFrame").src = "https://fancode.top/racing.html";
                $("fsFrame").src = "https://fancode.top/racing.html";
                
                $("modal").classList.add("open");
                showControls();
                setTimeout(() => $("modalClose").focus(), 100);
            });
        }

        function parseM3U(text) {
            const chs = [];
            const lines = text.split('\n');
            let currentTitle = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    let commaIndex = line.lastIndexOf(',');
                    if (commaIndex > 0) currentTitle = line.substring(commaIndex + 1).trim();
                } else if (line && !line.startsWith('#') && currentTitle) {
                    chs.push({ title: currentTitle, url: line });
                    currentTitle = "";
                }
            }
            return chs;
        }

        function playLiveStream(url, title) {
            $("modalTitle").textContent = title;
            $("modalMeta").textContent = "LIVE STREAM";
            $("modalDesc").textContent = "Live broadcast. Stream may take a moment to buffer.";
            $("episodeSection").style.display = "none";
            $("serverList").style.display = "none";
            
            $("playerPlaceholder").style.display = "none";
            $("playerFrame").src = url;
            $("fsFrame").src = url;
            
            $("modal").classList.add("open");
            showControls();
            setTimeout(() => $("modalClose").focus(), 100);
        }

        // --- Player Controls & Fullscreen ---
        function showControls() {
            $("playerControls").classList.add("visible");
            $("fsControls").classList.add("visible");
            
            clearTimeout(controlTimeout);
            controlTimeout = setTimeout(() => {
                $("playerControls").classList.remove("visible");
                $("fsControls").classList.remove("visible");
            }, 5000);
        }

        window.addEventListener("mousemove", showControls);
        window.addEventListener("scroll", showControls);

        $("btnFullscreen").addEventListener("click", () => {
            $("fullscreenOverlay").classList.add("active");
            $("fsFrame").src = $("playerFrame").src;
            showControls();
            setTimeout(() => $("btnExitFullscreen").focus(), 100);
        });

        $("btnExitFullscreen").addEventListener("click", () => {
            $("fullscreenOverlay").classList.remove("active");
            showControls();
        });

        function closeModal() {
            $("playerFrame").src = "about:blank";
            $("fsFrame").src = "about:blank";
            $("modal").classList.remove("open");
            $("fullscreenOverlay").classList.remove("active");
            $("serverList").style.display = "flex"; 
            currentItem = null;
            focusFirstCard();
        }

        function getFocusables() {
            if ($("fullscreenOverlay").classList.contains("active")) {
                return [$("btnExitFullscreen")];
            }
            const root = $("modal").classList.contains("open") ? $("modal") : document;
            return [...root.querySelectorAll('button.focusable, .card.focusable, input.focusable, select.focusable, a.focusable, [tabindex="0"]')].filter(el => {
                if (el.disabled) return false;
                const r = el.getBoundingClientRect();
                return r.width > 0 && r.height > 0;
            });
        }

        function moveFocus(dir) {
            const items = getFocusables();
            const active = document.activeElement;
            let idx = items.indexOf(active);
            if (idx < 0) { if (items[0]) items[0].focus(); return; }
            
            const cur = items[idx].getBoundingClientRect();
            const cx = cur.left + cur.width / 2;
            const cy = cur.top + cur.height / 2;
            let best = null; let bestScore = Infinity;

            items.forEach((el, i) => {
                if (i === idx) return;
                const r = el.getBoundingClientRect();
                const ex = r.left + r.width / 2;
                const ey = r.top + r.height / 2;
                const dx = ex - cx;
                const dy = ey - cy;

                let ok = false;
                if (dir === "left" && dx < -8) ok = true;
                if (dir === "right" && dx > 8) ok = true;
                if (dir === "up" && dy < -8) ok = true;
                if (dir === "down" && dy > 8) ok = true;
                if (!ok) return;

                const primary = dir === "left" || dir === "right" ? Math.abs(dx) : Math.abs(dy);
                const secondary = dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
                const score = primary + secondary * 2;
                
                if (score < bestScore) { bestScore = score; best = el; }
            });

            if (best) { best.focus(); best.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key;
            if (key === "Escape" || key === "BrowserBack" || key === "GoBack" || e.keyCode === 27 || e.keyCode === 10009) {
                if ($("fullscreenOverlay").classList.contains("active")) {
                    e.preventDefault();
                    $("fullscreenOverlay").classList.remove("active");
                    showControls();
                    return;
                }
                if ($("modal").classList.contains("open")) { e.preventDefault(); closeModal(); return; }
            }
            if (key === "ArrowUp") { e.preventDefault(); moveFocus("up"); showControls(); return; }
            if (key === "ArrowDown") { e.preventDefault(); moveFocus("down"); showControls(); return; }
            if (key === "ArrowLeft") { e.preventDefault(); moveFocus("left"); showControls(); return; }
            if (key === "ArrowRight") { e.preventDefault(); moveFocus("right"); showControls(); return; }
        });

        $("logoBtn").addEventListener("click", (e) => { e.preventDefault(); switchTab("movies"); });
        $("searchBtn").addEventListener("click", () => search());
        $("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
        $("seasonSelect").addEventListener("change", onSeasonChange);
        $("modalClose").addEventListener("click", closeModal);
        $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });

        loadTrending();
    </script>
</body>
</html>
