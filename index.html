<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>MelonLoader</title>
  <style>
    :root {
      --bg: #0b0f0c; --surface: #121a14; --surface2: #1a241c; --border: #2a3a2e;
      --text: #e8f0e9; --muted: #8ba08e; --accent: #7cff9a; --accent-dim: #3d9a55;
      --danger: #ff6b6b; --radius: 10px;
      --focus: #7cff9a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.4;
      font-size: 16px;
    }
    :focus { outline: none; }
    .focusable:focus, button:focus, a:focus, input:focus, select:focus, .card:focus {
      outline: 3px solid var(--focus) !important;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(124,255,154,.22);
    }
    .card:focus {
      transform: scale(1.05);
      border-color: var(--accent);
      z-index: 2;
    }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11,15,12,.96);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 1.15rem; color: var(--accent); text-decoration: none; white-space: nowrap;
    }
    .logo span {
      width: 28px; height: 28px; background: linear-gradient(135deg,#7cff9a,#3d9a55);
      border-radius: 7px; display: grid; place-items: center; font-size: 15px;
    }
    .search-wrap { flex: 1; min-width: 160px; max-width: 420px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 10px 44px 10px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: 15px;
    }
    .search-wrap button {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: var(--accent); color: #0b0f0c; border: none;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 14px;
      display: grid; place-items: center;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer;
      min-height: 42px;
    }
    .btn:focus { background: var(--border); }
    .btn.primary { background: var(--accent); color: #0b0f0c; border-color: var(--accent); font-weight: 600; }

    main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; }
    .section-title {
      font-size: 1.1rem; font-weight: 600; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .section-title .count { font-size: 13px; color: var(--muted); font-weight: 400; }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
    .card {
      background: var(--surface); border-radius: var(--radius); overflow: hidden;
      border: 2px solid transparent; cursor: pointer;
      transition: transform .12s, border-color .12s;
    }
    .card-poster { aspect-ratio: 2/3; background: var(--surface2); position: relative; overflow: hidden; }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-poster .placeholder {
      width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 26px;
    }
    .card-badge {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0,0,0,.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
    }
    .card-body { padding: 8px 9px 10px; }
    .card-title {
      font-size: 13px; font-weight: 600; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .status { text-align: center; padding: 40px 16px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .spinner {
      width: 34px; height: 34px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Compact modal for Fire TV */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 12px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; width: min(720px, 96vw);
      max-height: 92vh; overflow-y: auto;
      position: relative; margin: auto;
    }
    .modal-close {
      position: absolute; top: 8px; right: 8px; width: 40px; height: 40px;
      border-radius: 50%; border: none; background: rgba(0,0,0,.75);
      color: #fff; font-size: 22px; cursor: pointer; z-index: 5;
    }
    .player-wrap {
      width: 100%; background: #000;
      /* Smaller player so controls below stay visible */
      max-height: 42vh;
      aspect-ratio: 16/9;
      position: relative;
    }
    .player-wrap iframe {
      width: 100%; height: 100%; border: 0; display: block;
    }
    .player-placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--muted); font-size: 14px; text-align: center; padding: 12px;
    }
    .modal-body { padding: 12px 14px 16px; }
    .modal-title { font-size: 1.15rem; margin-bottom: 4px; padding-right: 44px; }
    .modal-meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .modal-desc {
      font-size: 13px; color: #c5d4c7; margin-bottom: 10px;
      max-height: 48px; overflow-y: auto;
    }
    .server-row, .ep-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .server-btn, .ep-btn {
      padding: 10px 12px; border-radius: 8px; border: 2px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer;
      min-height: 42px; min-width: 42px;
    }
    .server-btn.active, .ep-btn.active {
      background: var(--accent); color: #0b0f0c; border-color: var(--accent); font-weight: 600;
    }
    .label {
      font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .04em; margin-bottom: 6px;
    }
    .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    footer {
      text-align: center; padding: 12px; color: var(--muted); font-size: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo focusable" id="logoBtn" tabindex="0">
      <span>🍈</span> MelonLoader
    </a>
    <div class="search-wrap">
      <input id="searchInput" class="focusable" type="search" placeholder="Search movies &amp; TV…" autocomplete="off" tabindex="0" />
      <button id="searchBtn" class="focusable" title="Search" tabindex="0">🔍</button>
    </div>
    <div class="header-actions">
      <button class="btn focusable" id="trendingBtn" tabindex="0">Trending</button>
      <button class="btn primary focusable" id="inceptionBtn" tabindex="0">Inception</button>
    </div>
  </header>

  <main>
    <div class="section-title">
      <span id="sectionLabel">Trending</span>
      <span class="count" id="resultCount"></span>
    </div>
    <p class="hint">Remote: ↑↓←→ move · OK select · Back closes player</p>
    <div id="content">
      <div class="status"><div class="spinner"></div>Loading…</div>
    </div>
  </main>

  <footer>MelonLoader · Fire TV · TMDB + VidSrc</footer>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close focusable" id="modalClose" tabindex="0">×</button>
      <div class="player-wrap">
        <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
        <div class="player-placeholder" id="playerPlaceholder">Choose a server below</div>
      </div>
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle">—</h2>
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-desc" id="modalDesc"></div>

        <div id="episodeSection" style="display:none">
          <div class="label">Season / Episode</div>
          <div style="margin-bottom:8px">
            <select id="seasonSelect" class="btn focusable" tabindex="0"></select>
          </div>
          <div class="ep-row" id="epList"></div>
        </div>

        <div class="label">Server (press OK to play)</div>
        <div class="server-row" id="serverList"></div>
        <p class="note">Back = close · If blank, try another server</p>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded TMDB v3 key (personal use) — no typing on Fire Stick
    const HARDCODED_API_KEY = "f39bddc7bc5efa5f39a3dd0be729df5e";

    const TMDB = "https://api.themoviedb.org/3";
    const IMG = "https://image.tmdb.org/t/p/w342";

    const SERVERS = [
      {
        name: "VidSrc.me",
        movie: (id) => `https://vidsrc.me/embed/movie/${id}`,
        tv: (id, s, e) => `https://vidsrc.me/embed/tv/${id}/${s}/${e}`
      },
      {
        name: "VidSrc.to",
        movie: (id) => `https://vidsrc.to/embed/movie/${id}`,
        tv: (id, s, e) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}`
      },
      {
        name: "VidSrc.xyz",
        movie: (id) => `https://vidsrc.xyz/embed/movie/${id}`,
        tv: (id, s, e) => `https://vidsrc.xyz/embed/tv/${id}/${s}/${e}`
      },
      {
        name: "MultiEmbed",
        movie: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`,
        tv: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`
      }
    ];

    let apiKey = HARDCODED_API_KEY;
    let currentItems = [];
    let currentItem = null;
    let currentSe = 1;
    let currentEp = 1;

    function $(id) { return document.getElementById(id); }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function tmdb(path, params = {}) {
      const q = new URLSearchParams({ api_key: apiKey, language: "en-US", ...params });
      const res = await fetch(`${TMDB}${path}?${q}`);
      if (!res.ok) throw new Error("TMDB HTTP " + res.status);
      return res.json();
    }

    function showStatus(html, isError) {
      $("content").innerHTML = `<div class="status ${isError ? "error" : ""}">${html}</div>`;
      $("resultCount").textContent = "";
    }

    function posterOf(item) {
      return item.poster_path ? IMG + item.poster_path : null;
    }
    function titleOf(item) { return item.title || item.name || "Untitled"; }
    function yearOf(item) {
      const d = item.release_date || item.first_air_date || "";
      return d ? d.slice(0, 4) : "";
    }
    function mediaType(item) {
      if (item.media_type === "tv" || item.first_air_date) return "tv";
      if (item.media_type === "movie" || item.release_date) return "movie";
      return item.title ? "movie" : "tv";
    }

    async function loadTrending() {
      $("sectionLabel").textContent = "Trending";
      $("searchInput").value = "";
      showStatus(`<div class="spinner"></div>Loading…`);
      try {
        const data = await tmdb("/trending/all/week");
        const items = (data.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
        currentItems = items;
        renderGrid(items);
        $("resultCount").textContent = items.length + " titles";
        focusFirstCard();
      } catch (e) {
        showStatus(`<p><strong>${escapeHtml(e.message)}</strong></p>`, true);
      }
    }

    async function search(q) {
      q = (q || $("searchInput").value || "").trim();
      if (!q) return loadTrending();
      $("searchInput").value = q;
      $("sectionLabel").textContent = `Search: “${q}”`;
      showStatus(`<div class="spinner"></div>Searching…`);
      try {
        const data = await tmdb("/search/multi", { query: q, include_adult: "false" });
        const items = (data.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
        currentItems = items;
        renderGrid(items);
        $("resultCount").textContent = items.length + " results";
        focusFirstCard();
      } catch (e) {
        showStatus(`<p><strong>${escapeHtml(e.message)}</strong></p>`, true);
      }
    }

    function renderGrid(items) {
      if (!items.length) {
        showStatus("No results.");
        return;
      }
      $("content").innerHTML = `<div class="grid" id="cardGrid">${items.map((item, idx) => {
        const poster = posterOf(item);
        const title = titleOf(item);
        const year = yearOf(item);
        const type = mediaType(item) === "tv" ? "TV" : "Movie";
        const score = item.vote_average ? item.vote_average.toFixed(1) : "";
        return `
          <div class="card focusable" tabindex="0" data-idx="${idx}" role="button"
               aria-label="${escapeHtml(title)}">
            <div class="card-poster">
              ${poster
                ? `<img src="${poster}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎬</div>'"/>`
                : `<div class="placeholder">🎬</div>`}
              <span class="card-badge">${type}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${escapeHtml(title)}</div>
              <div class="card-meta">${year ? year + " · " : ""}${score ? "★ " + score : ""}</div>
            </div>
          </div>`;
      }).join("")}</div>`;

      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => openDetail(parseInt(card.dataset.idx, 10)));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " " || e.key === "OK") {
            e.preventDefault();
            openDetail(parseInt(card.dataset.idx, 10));
          }
        });
      });
    }

    function focusFirstCard() {
      const c = document.querySelector(".card");
      if (c) setTimeout(() => c.focus(), 40);
    }

    async function openDetail(idx) {
      const item = currentItems[idx];
      if (!item) return;
      currentItem = item;
      currentSe = 1;
      currentEp = 1;

      const type = mediaType(item);
      $("modalTitle").textContent = titleOf(item);
      $("modalMeta").textContent = [
        type === "tv" ? "TV Series" : "Movie",
        yearOf(item),
        item.vote_average ? "★ " + item.vote_average.toFixed(1) : ""
      ].filter(Boolean).join("  ·  ");
      $("modalDesc").textContent = item.overview || "No description.";
      $("playerFrame").src = "about:blank";
      $("playerPlaceholder").style.display = "grid";

      $("serverList").innerHTML = SERVERS.map((s, i) =>
        `<button class="server-btn focusable ${i === 0 ? "active" : ""}" data-i="${i}" tabindex="0">${s.name}</button>`
      ).join("");

      document.querySelectorAll(".server-btn").forEach(btn => {
        btn.addEventListener("click", () => selectServer(btn.dataset.i));
        btn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectServer(btn.dataset.i);
          }
        });
      });

      if (type === "tv") {
        $("episodeSection").style.display = "block";
        try {
          const detail = await tmdb(`/tv/${item.id}`);
          const seasons = (detail.seasons || []).filter(s => s.season_number > 0);
          $("seasonSelect").innerHTML = seasons.map(s =>
            `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count || "?"} eps)</option>`
          ).join("") || `<option value="1">Season 1</option>`;
          await loadEpisodeButtons(1);
        } catch {
          $("seasonSelect").innerHTML = `<option value="1">Season 1</option>`;
          buildSimpleEpisodes(12);
        }
      } else {
        $("episodeSection").style.display = "none";
      }

      $("modal").classList.add("open");
      selectServer(0);
      setTimeout(() => {
        const s = document.querySelector(".server-btn");
        if (s) s.focus();
      }, 80);
    }

    async function onSeasonChange() {
      const se = parseInt($("seasonSelect").value, 10) || 1;
      currentSe = se;
      currentEp = 1;
      await loadEpisodeButtons(se);
      selectServer(document.querySelector(".server-btn.active")?.dataset.i || 0);
    }

    async function loadEpisodeButtons(se) {
      try {
        const data = await tmdb(`/tv/${currentItem.id}/season/${se}`);
        const eps = data.episodes || [];
        if (!eps.length) return buildSimpleEpisodes(12);
        $("epList").innerHTML = eps.map(ep =>
          `<button class="ep-btn focusable ${ep.episode_number === currentEp ? "active" : ""}" tabindex="0"
            data-ep="${ep.episode_number}">${ep.episode_number}</button>`
        ).join("");
        wireEpButtons();
      } catch {
        buildSimpleEpisodes(12);
      }
    }

    function buildSimpleEpisodes(n) {
      $("epList").innerHTML = Array.from({ length: n }, (_, i) => i + 1).map(n =>
        `<button class="ep-btn focusable ${n === currentEp ? "active" : ""}" tabindex="0" data-ep="${n}">${n}</button>`
      ).join("");
      wireEpButtons();
    }

    function wireEpButtons() {
      document.querySelectorAll(".ep-btn").forEach(btn => {
        btn.addEventListener("click", () => selectEpisode(parseInt(btn.dataset.ep, 10)));
        btn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectEpisode(parseInt(btn.dataset.ep, 10));
          }
        });
      });
    }

    function selectEpisode(ep) {
      currentEp = ep;
      document.querySelectorAll(".ep-btn").forEach(b => {
        b.classList.toggle("active", parseInt(b.dataset.ep, 10) === ep);
      });
      const active = document.querySelector(".server-btn.active");
      selectServer(active ? active.dataset.i : 0);
    }

    function selectServer(i) {
      i = parseInt(i, 10) || 0;
      document.querySelectorAll(".server-btn").forEach(b => {
        b.classList.toggle("active", parseInt(b.dataset.i, 10) === i);
      });
      const server = SERVERS[i] || SERVERS[0];
      const item = currentItem;
      if (!item) return;
      const type = mediaType(item);
      const url = type === "tv"
        ? server.tv(item.id, currentSe, currentEp)
        : server.movie(item.id);
      $("playerPlaceholder").style.display = "none";
      $("playerFrame").src = url;
    }

    function closeModal() {
      $("playerFrame").src = "about:blank";
      $("modal").classList.remove("open");
      currentItem = null;
      focusFirstCard();
    }

    function getFocusables() {
      const root = $("modal").classList.contains("open") ? $("modal") : document;
      return [...root.querySelectorAll(
        'button.focusable, .card.focusable, input.focusable, select.focusable, a.focusable, [tabindex="0"]'
      )].filter(el => {
        if (el.disabled) return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0;
      });
    }

    function moveFocus(dir) {
      const items = getFocusables();
      const active = document.activeElement;
      let idx = items.indexOf(active);
      if (idx < 0) {
        if (items[0]) items[0].focus();
        return;
      }
      const cur = items[idx].getBoundingClientRect();
      const cx = cur.left + cur.width / 2;
      const cy = cur.top + cur.height / 2;

      let best = null;
      let bestScore = Infinity;

      items.forEach((el, i) => {
        if (i === idx) return;
        const r = el.getBoundingClientRect();
        const ex = r.left + r.width / 2;
        const ey = r.top + r.height / 2;
        const dx = ex - cx;
        const dy = ey - cy;

        let ok = false;
        if (dir === "left" && dx < -8) ok = true;
        if (dir === "right" && dx > 8) ok = true;
        if (dir === "up" && dy < -8) ok = true;
        if (dir === "down" && dy > 8) ok = true;
        if (!ok) return;

        const primary = dir === "left" || dir === "right" ? Math.abs(dx) : Math.abs(dy);
        const secondary = dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
        const score = primary + secondary * 2;
        if (score < bestScore) {
          bestScore = score;
          best = el;
        }
      });

      if (best) {
        best.focus();
        best.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key;
      if (key === "Escape" || key === "BrowserBack" || key === "GoBack" || e.keyCode === 27 || e.keyCode === 10009) {
        if ($("modal").classList.contains("open")) {
          e.preventDefault();
          closeModal();
          return;
        }
      }
      if (key === "ArrowUp") { e.preventDefault(); moveFocus("up"); return; }
      if (key === "ArrowDown") { e.preventDefault(); moveFocus("down"); return; }
      if (key === "ArrowLeft") { e.preventDefault(); moveFocus("left"); return; }
      if (key === "ArrowRight") { e.preventDefault(); moveFocus("right"); return; }
    });

    $("logoBtn").addEventListener("click", (e) => { e.preventDefault(); loadTrending(); });
    $("trendingBtn").addEventListener("click", () => loadTrending());
    $("inceptionBtn").addEventListener("click", () => search("Inception"));
    $("searchBtn").addEventListener("click", () => search());
    $("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") search();
    });
    $("seasonSelect").addEventListener("change", onSeasonChange);
    $("modalClose").addEventListener("click", closeModal);
    $("modal").addEventListener("click", (e) => {
      if (e.target === $("modal")) closeModal();
    });

    loadTrending();
  </script>
</body>
</html>
